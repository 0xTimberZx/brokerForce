name: Daily Ingestion

# Runs the full daily data pipeline against the PERSISTENT database in the
# DATABASE_URL repo secret. It must be persistent: the active-tier gate
# (Architecture.md §5, apps/ingestion/src/tier-gate.ts) promotes a pair only
# after 7 distinct days of stored volume snapshots -- an ephemeral per-run
# database can never accumulate that evidence, so a service container here
# would silently make promotion impossible.
#
# Set the secret at: repo Settings -> Secrets and variables -> Actions ->
# New repository secret, name DATABASE_URL, value a Postgres connection
# string (Supabase / Railway / Render / Timescale Cloud all work -- the
# schema degrades gracefully where TimescaleDB isn't available, see
# packages/db/migrations/001_init.sql).

on:
  schedule:
    # 06:17, not 06:00: GitHub warns top-of-the-hour schedules are the likeliest
    # to be delayed or dropped under load. Editing this line also re-registers
    # the schedule -- it silently stopped firing after 2026-09-24 (every run
    # since came from the Supabase watchdog, docs/ingestion-automation.md).
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch: {}

concurrency:
  group: daily-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Run time depends on which region GitHub puts the runner in: the
    # database is in us-west-2, and the pipeline used to make ~10k sequential
    # queries, so west-coast runners finished in ~28-33 min while east-coast
    # ones took ~40 and four were cancelled at the old 40-min limit
    # (#124-#126, #133). The heaviest loops (daily candles, pair_metrics, pool
    # aggregates) are now batched; 60 adds headroom for the remaining
    # per-row work and ingest-pools' ~10.5 min of fixed per-pair throttling,
    # while still tripping on a genuine hang.
    timeout-minutes: 60
    steps:
      - name: Require DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. This workflow needs a PERSISTENT Postgres database -- the 7-day tier-gate evidence accumulates across runs and would be lost in an ephemeral one. See the comment at the top of this workflow file."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Order matters: assets before pairs, metrics before ORT, pool
      # ingestion before ORT so same-day tier promotions get scored.
      - name: Run daily pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional but strongly recommended: a free CoinGecko "Demo" key.
          # GitHub runners share egress IPs and the keyless public API
          # rate-limits them aggressively -- the first run 429'd on nearly
          # every candle call. https://www.coingecko.com/en/api/pricing
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          # The Graph gateway key for Uniswap-v3 subgraph enrichment (spec 012).
          # Optional: without it, enrich-pools-subgraph no-ops and the tick/
          # swap-count columns stay NULL -- the rest of the pipeline is
          # unaffected. Runs AFTER ingest-pools so the v3 pool rows + their
          # validated on-chain addresses already exist, and BEFORE compute-ort
          # only for ordering tidiness (ORT never reads these columns).
          GRAPH_API_KEY: ${{ secrets.GRAPH_API_KEY }}
        run: |
          npm run migrate
          npm run ingest
          npm run generate-pairs
          npm run compute-metrics
          npm run ingest-pools
          npm run enrich-pools-subgraph
          npm run enrich-pools-solana
          npm run compute-ort

      # Market sentiment (Fear & Greed) is an INDEPENDENT cog -- it doesn't
      # feed the asset/pool/ORT chain above (regime-aware analytics on top of
      # it is separate, spec-first work). Run as its own step so a sentiment
      # feed being down surfaces as a failed step without touching the core
      # pipeline's result, and vice versa. always() so it runs even if an
      # earlier step failed.
      - name: Ingest market sentiment
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Each source activates only when its key is present -- Alternative.me
          # is keyless and always runs; CoinMarketCap joins when CMC_API_KEY is
          # set; CFGI (forward-only) joins when CFGI_API_KEY is set. CFGI is
          # credit-metered, so it defaults to the MARKET-wide index only (one
          # request/day). To spend credits on per-token readings, set a repo
          # variable CFGI_PER_TOKEN ("all" or a comma list like "BTC,ETH,SOL")
          # and pass it here -- deliberately omitted by default to conserve.
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          CFGI_API_KEY: ${{ secrets.CFGI_API_KEY }}
        run: npm run ingest-sentiment
